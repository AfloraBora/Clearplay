<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clearplay</title><link rel="stylesheet" href="popup.css"></head><body>
<header><span class="orb" aria-hidden="true"></span><h1>Clearplay</h1><label class="toggle" title="Quality lock"><input id="enabled" type="checkbox" aria-label="Quality lock"><span></span></label></header>
<main><section class="glass"><div class="row"><label for="target">Quality</label><select id="target"><option value="1080">1080p</option><option value="1440">1440p</option><option value="2160">4K</option><option value="highest">Highest</option></select></div><div class="row"><label for="buffer">Prebuffer</label><select id="buffer"><option value="0">Off</option><option value="5">5 seconds</option><option value="10">10 seconds</option><option value="20">20 seconds</option></select></div></section>
<section class="glass"><label class="row" for="indicator"><span>Video pill</span><span class="toggle"><input id="indicator" type="checkbox"><span></span></span></label><label class="row" for="sound"><span>Click sounds</span><span class="toggle"><input id="sound" type="checkbox"><span></span></span></label></section>
<button id="bypass">Bypass this video</button><div class="readout"><span id="status">No video open</span><span id="details"></span></div><p id="feedback" role="status" hidden></p></main>
<script src="quality.js"></script><script src="popup.js"></script></body></html>
